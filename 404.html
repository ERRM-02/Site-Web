<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Introuvable — ERRM</title>
    <meta name="robots" content="noindex,follow">
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/css/style.css?v=20260903">
</head>
<body>
    <header class="navbar">
        <div class="container navbar-container">
            <a href="/" class="navbar-logo">
                <img src="/images/logo-errm-512.webp" width="512" height="154" alt="ERRM">
            </a>
            <nav class="navbar-menu">
                <a href="/">Accueil</a>
                <a href="/savoir-faire">Savoir-Faire</a>
                <a href="/realisations">Réalisations</a>
                <a href="/a-propos">À Propos</a>
                <a href="/contact" class="btn">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center;">
            <div class="hero-bg-img" style="filter: grayscale(80%) brightness(0.3);"></div>
            <div class="container" style="position: relative; z-index: 2;">
                <h1 class="reveal" style="font-size: 6rem; color: var(--primaire); margin-bottom: 10px;">404</h1>
                <h2 class="reveal reveal-delay-1" style="font-size: 2rem; color: white; margin-bottom: 30px;">Oups ! Cette page n'existe plus.</h2>
                <p class="reveal reveal-delay-1" style="color: #ccc; max-width: 500px; margin: 0 auto 40px auto; line-height: 1.6;">
                    Il semblerait que vous ayez suivi un lien brisé ou que la page ait été déplacée. Ne vous inquiétez pas, notre atelier est toujours là !
                </p>
                <div class="reveal reveal-delay-2">
                    <a href="/" class="btn">Retour à l'accueil</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container footer-bottom">
            <p>&copy; 2026 ERRM. Tous droits réservés.</p>
        </div>
    </footer>
</body>
</html>
